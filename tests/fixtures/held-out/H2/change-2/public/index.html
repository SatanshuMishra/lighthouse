<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Steepwell</title>
<link rel="stylesheet" href="css/steepwell.css">
<script>
(function () {
  var storageKey = "steepwell-theme";
  var root = document.documentElement;

  function savedTheme() {
    try {
      return localStorage.getItem(storageKey) === "dark" ? "dark" : "light";
    } catch (error) {
      return "light";
    }
  }

  function saveTheme(theme) {
    try {
      localStorage.setItem(storageKey, theme);
      return true;
    } catch (error) {
      return false;
    }
  }

  function applyTheme(theme) {
    root.setAttribute("data-theme", theme);
    var toggle = document.getElementById("theme-toggle");
    if (toggle) {
      toggle.setAttribute("aria-pressed", theme === "dark" ? "true" : "false");
    }
  }

  applyTheme(savedTheme());

  document.addEventListener("DOMContentLoaded", function () {
    applyTheme(root.getAttribute("data-theme"));
    document.getElementById("theme-toggle").addEventListener("click", function () {
      var next = root.getAttribute("data-theme") === "dark" ? "light" : "dark";
      saveTheme(next);
      applyTheme(next);
    });
  });
})();
</script>
</head>
<body>
<header class="masthead">
<h1>Steepwell</h1>
<button type="button" id="theme-toggle" class="theme-toggle" aria-pressed="false">Dark theme</button>
</header>
<main>
<section class="steep-timer" aria-labelledby="steep-heading">
<h2 id="steep-heading">Steeping timer</h2>
<label for="tea-choice">Tea</label>
<select id="tea-choice">
<option value="120">Green, 2 minutes</option>
<option value="240" selected>Black, 4 minutes</option>
<option value="300">Oolong, 5 minutes</option>
<option value="360">Herbal, 6 minutes</option>
</select>
<button type="button" id="steep-start">Start</button>
<p id="steep-clock" aria-live="polite">4:00</p>
</section>
</main>
<script type="module" src="js/timer.js"></script>
</body>
</html>
